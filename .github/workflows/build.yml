name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev cmake gettext

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0.0" buildozer

      - name: Configure buildozer.spec
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
            sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          fi

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | python -m buildozer android update || true

      - name: Build APK & Extract Error Log
        run: |
          export WARN_ON_ROOT=0
          python -m buildozer -v android debug || (
            echo "================ FATAL ERROR LOG ================"
            find . -name "build.log" -exec grep -i -C 5 "error" {} + || find ~/.buildozer -name "*.log" -exec tail -n 50 {} + || true
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsBeacon-APK
          path: bin/*.apk
