name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev cmake gettext

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: Accept Android SDK Licenses & Build APK
        run: |
          export WARN_ON_ROOT=0
          
          # Initialize buildozer to set up directory structures
          buildozer init || true
          
          # Force accept all Android SDK licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933786574810100f73d75115833013c4b29691c\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c303a38122f77e40080317153a2\n84831b9409646a2d8f305fd09c2f9e269e8f4d44\nd9754edd5143ce577f2e3e21010db90327f2f111\n119b77d8a113a378d30e15b3a32f63f5383f218f" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Run build with non-interactive flag
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsBeacon-APK
          path: bin/*.apk
